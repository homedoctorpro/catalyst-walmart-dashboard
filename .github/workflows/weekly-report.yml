name: Weekly report auto-ingest

# Polls the reports inbox for Hailey's forwarded "2026XX Weekly Sales Report
# Catalyst" email, ingests the attachment, rebuilds the dashboard, sends the
# full distro email, and publishes to GitHub Pages — all hands-off.

on:
  schedule:
    # Off-the-hour minutes: GitHub's scheduled-run queue is most congested at
    # :00, and cron delivery is best-effort — runs get dropped, not just delayed.
    # On 2026-07-27 this fired at 01:14 / 04:51 / 08:18 / 11:46 / 14:02 UTC
    # (gaps of 2-3.5h despite */15), which is why the Monday watch mode below
    # exists rather than relying on poll frequency alone.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: "Rebuild from current data-repo contents even if no new email"
        type: boolean
        default: false
      skip_email:
        description: "Skip sending the distro email (build/publish only)"
        type: boolean
        default: false
      dev_email:
        description: "Send the email to the dev recipient only (test/example send)"
        type: boolean
        default: false

# Serialize runs so two cycles can't grab the same email before the state file
# is committed.
concurrency:
  group: weekly-report
  cancel-in-progress: false

permissions:
  contents: write   # push regenerated dashboard.html back to this repo (Pages)
  actions:  write   # self-chain the Monday watch (workflow_dispatch via GITHUB_TOKEN)

jobs:
  ingest-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # must exceed WATCH_MAX_SECONDS below, stay under the 6h ceiling
    steps:
      - name: Checkout dashboard repo (code + templates)
        uses: actions/checkout@v4

      - name: Checkout private data repo (.xlsx sources)
        uses: actions/checkout@v4
        with:
          repository: homedoctorpro/catalyst-walmart-data
          path: _data
          ssh-key: ${{ secrets.DATA_REPO_DEPLOY_KEY }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll inbox for new weekly report
        id: poll
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
        run: |
          set -uo pipefail

          # --- Monday watch mode -------------------------------------------
          # Hailey's forward has landed 10:24am-3:16pm ET on Mondays (weeks
          # 21-25). Cron alone can miss it by hours, so inside the window we
          # hold the job open and re-poll every 60s until the email arrives.
          # Outside the window this degrades to the old single-shot poll.
          #
          # Bounds are wall-clock America/New_York, NOT fixed UTC hours, so the
          # window stays at 9:30am ET across the DST changeover instead of
          # sliding an hour every November/March.
          export TZ=America/New_York
          WATCH_START="09:30"
          WATCH_END="17:00"
          WATCH_MAX_SECONDS=19800   # 5h30m of job time, under the 6h ceiling
          POLL_INTERVAL=60

          now=$(date +%s)
          dow=$(date +%u)                          # 1 = Monday, in ET
          start_ts=$(date -d "today $WATCH_START" +%s)
          end_ts=$(date -d "today $WATCH_END" +%s)
          job_cap=$(( now + WATCH_MAX_SECONDS ))

          deadline=0
          if [ "${{ inputs.force_rebuild }}" = "true" ]; then
            # A manual force-rebuild must run NOW. Without this, a rebuild
            # dispatched on a Monday afternoon would sit in the watch loop until
            # 5pm ET before building anything.
            echo "force_rebuild requested — skipping watch mode, single poll."
          elif [ "$dow" = "1" ] && [ "$now" -lt "$end_ts" ]; then
            if [ "$now" -lt "$start_ts" ]; then
              # Pre-window Monday run. Don't just exit — cron delivery is so
              # sparse that the next run might not land until well after 9:30,
              # leaving the window unwatched. Instead, hold this job open until
              # the window opens, provided we can reach it within our job cap.
              if [ "$start_ts" -ge "$job_cap" ]; then
                echo "Monday, but 9:30am ET is beyond this job's 5h30m budget — single poll; a later run picks up the watch."
              else
                echo "Monday pre-window: sleeping $(( (start_ts - now) / 60 ))m until $WATCH_START ET, then watching."
                sleep $(( start_ts - now ))
                deadline=$(( end_ts < job_cap ? end_ts : job_cap ))
              fi
            else
              deadline=$(( end_ts < job_cap ? end_ts : job_cap ))
            fi
          fi

          if [ "$deadline" != "0" ]; then
            echo "Monday watch mode: polling every ${POLL_INTERVAL}s until $(date -d "@$deadline") (window closes $WATCH_END ET)"
          else
            echo "Outside Monday watch window (ET dow=$dow $(date '+%H:%M %Z')) — single poll."
          fi

          found=false
          weeks=""
          polls=0
          while : ; do
            # Blank GITHUB_OUTPUT so the poller doesn't append found=/weeks= on
            # every iteration; this step writes the authoritative values once.
            ok=true
            out=$(GITHUB_OUTPUT= python cloud_poller.py \
                    --inbox-dir _data \
                    --state-file _data/.processed_message_ids 2>&1) || ok=false
            polls=$(( polls + 1 ))
            echo "$out"
            if [ "$ok" = "false" ]; then
              # A transient IMAP/network blip must not abort a 5h watch; just
              # retry next cycle. Outside watch mode, still fail loudly.
              if [ "$deadline" = "0" ]; then
                echo "::error::cloud_poller.py failed on a single-shot poll"
                exit 1
              fi
              echo "::warning::poll attempt ${polls} failed — retrying in ${POLL_INTERVAL}s"
              out=""
            fi
            if printf '%s\n' "$out" | grep -q '^\[poller\] found=True'; then
              found=true
              weeks=$(printf '%s\n' "$out" | sed -n 's/^\[poller\] found=True weeks=//p')
              echo "New week(s) after ${polls} poll(s): ${weeks}"
              break
            fi
            [ "$(date -u +%s)" -lt "$deadline" ] || break
            sleep "$POLL_INTERVAL"
          done

          {
            echo "found=$found"
            echo "weeks=$weeks"
            echo "watched=$( [ "$deadline" = "0" ] && echo false || echo true )"
          } >> "$GITHUB_OUTPUT"

      - name: Decide whether to build
        id: gate
        run: |
          if [ "${{ steps.poll.outputs.found }}" = "true" ] || [ "${{ inputs.force_rebuild }}" = "true" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "No new email and no force_rebuild — nothing to do."
          fi

      - name: Commit new source file(s) to data repo
        if: steps.poll.outputs.found == 'true'
        working-directory: _data
        run: |
          git config user.name  "catalyst-bot"
          git config user.email "ligneticsdata@gmail.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add forwarded weekly report(s): ${{ steps.poll.outputs.weeks }}"
            git push
          else
            echo "No data-repo changes to commit."
          fi

      - name: Stage source files for the build
        if: steps.gate.outputs.build == 'true'
        run: |
          # extract_data.py reads workbooks from the repo root.
          cp _data/*.xlsx . 2>/dev/null || true
          cp _data/*.xlsb . 2>/dev/null || true
          ls -1 *.xlsx *.xlsb 2>/dev/null | sed 's/^/  staged: /' || true

      - name: Build dashboard + send distro email
        if: steps.gate.outputs.build == 'true'
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          FORCE_FULL_DISTRO: ${{ inputs.skip_email == true && '0' || '1' }}
          SKIP_EMAIL: ${{ inputs.skip_email == true && '1' || '0' }}
          DEV_ONLY_EMAIL: ${{ inputs.dev_email == true && '1' || '0' }}
          # Duplicate-send guard state. This checkout is thrown away after the
          # run, so the log has to live in the persisted data repo or the guard
          # forgets every send and can't block a repeat. Committed below.
          EMAIL_SEND_LOG: _data/.email_send_log.json
          PYTHONHASHSEED: "0"   # deterministic dict ordering → minimal output churn
        run: python extract_data.py

      - name: Persist email send log to data repo
        if: steps.gate.outputs.build == 'true'
        working-directory: _data
        run: |
          git config user.name  "catalyst-bot"
          git config user.email "ligneticsdata@gmail.com"
          git add .email_send_log.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git pull --rebase --autostash || true
            git commit -m "Record weekly report send: ${{ steps.poll.outputs.weeks || 'manual' }}"
            git push
          else
            echo "No send-log change to persist."
          fi

      - name: Publish regenerated dashboard to Pages
        if: steps.gate.outputs.build == 'true'
        run: |
          git config user.name  "catalyst-bot"
          git config user.email "ligneticsdata@gmail.com"
          git add dashboard.html store_map.html stores_geo.json
          if ! git diff --cached --quiet; then
            git commit -m "Auto-rebuild dashboard: ${{ steps.poll.outputs.weeks || 'manual' }}"
            git push
          else
            echo "Dashboard output unchanged — nothing to publish."
          fi

      - name: Extend Monday watch
        # A watch run caps at 5h30m (6h job ceiling), but the Monday window is
        # 9:30am-5:00pm ET. If we time out empty-handed with the window still
        # open, hand off to a fresh run. workflow_dispatch is one of the two
        # events GITHUB_TOKEN is allowed to trigger, so this does not need a PAT.
        # The 5:00pm ET bound guarantees the chain terminates.
        if: always() && steps.poll.outputs.watched == 'true' && steps.poll.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TZ: America/New_York
        run: |
          if [ "$(date +%u)" = "1" ] && [ "$(date +%s)" -lt "$(date -d 'today 17:00' +%s)" ]; then
            echo "Watch window still open at $(date) — chaining a follow-on run."
            gh workflow run weekly-report.yml --ref "${{ github.ref_name }}"
          else
            echo "Monday watch window closed at $(date) — standing down until next week."
          fi
