<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalyst Pet &amp; Feline Fresh – Chewy Sales Dashboard</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #f0f2f5; color: #1a1a2e; min-height: 100vh; }

  /* ── Gate ── */
  #gate { display: flex; align-items: center; justify-content: center;
          min-height: 100vh; background: linear-gradient(135deg, #0b3d2e 0%, #0d5c43 100%); }
  .gate-card { background: #fff; border-radius: 16px; padding: 48px 40px;
               box-shadow: 0 20px 60px rgba(0,0,0,0.4); text-align: center; width: 360px; }
  .gate-card h1 { font-size: 1.4rem; margin-bottom: 8px; color: #0b3d2e; }
  .gate-card p  { color: #666; margin-bottom: 28px; font-size: 0.9rem; }
  .gate-card input { width: 100%; padding: 12px 16px; border: 2px solid #e0e0e0;
                     border-radius: 8px; font-size: 1rem; margin-bottom: 16px; transition: border-color 0.2s; }
  .gate-card input:focus { outline: none; border-color: #12805c; }
  .gate-card button { width: 100%; padding: 12px; background: #12805c; color: #fff;
                      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
                      cursor: pointer; transition: background 0.2s; }
  .gate-card button:hover { background: #0d6347; }
  .gate-card .error { color: #d32f2f; font-size: 0.85rem; margin-top: 8px; min-height: 20px; }

  /* ── App Shell ── */
  #app { display: none; flex-direction: column; min-height: 100vh; }
  header { background: linear-gradient(90deg, #0b3d2e 0%, #0d5c43 100%); color: #fff;
           padding: 14px 24px; display: flex; align-items: center; justify-content: space-between;
           box-shadow: 0 2px 8px rgba(0,0,0,0.3); }
  header h1 { font-size: 1.15rem; font-weight: 700; }
  header .meta { font-size: 0.8rem; opacity: 0.7; }

  /* ── Tabs ── */
  .tab-bar { display: flex; background: #fff; border-bottom: 2px solid #e0e0e0; padding: 0 24px; overflow-x: auto; }
  .tab-btn { padding: 13px 18px; border: none; background: transparent; font-size: 0.9rem;
             font-weight: 500; color: #666; cursor: pointer; border-bottom: 3px solid transparent;
             margin-bottom: -2px; transition: all 0.2s; white-space: nowrap; }
  .tab-btn:hover { color: #12805c; }
  .tab-btn.active { color: #12805c; border-bottom-color: #12805c; font-weight: 700; }
  .tab-panel { display: none; flex: 1; padding: 20px 24px; }
  .tab-panel.active { display: block; }

  /* ── KPI Cards ── */
  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi-card { background: #fff; border-radius: 12px; padding: 18px 20px;
              box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 4px solid #12805c; }
  .kpi-label { font-size: 0.72rem; font-weight: 700; color: #888; text-transform: uppercase;
               letter-spacing: 0.05em; margin-bottom: 6px; }
  .kpi-value { font-size: 1.55rem; font-weight: 800; color: #1a1a2e; line-height: 1.05; }
  .kpi-chg   { font-size: 0.8rem; font-weight: 700; margin-left: 5px; }
  .kpi-chg.up { color: #12805c; } .kpi-chg.down { color: #d32f2f; }
  .kpi-sub   { font-size: 0.72rem; color: #aaa; margin-top: 6px; }

  /* ── Filter bar ── */
  .filter-bar { background: #fff; border-radius: 12px; padding: 12px 18px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); display: flex; align-items: center;
                gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .filter-bar > span.lbl { font-weight: 700; font-size: 0.82rem; color: #444; margin-right: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 0.8rem; color: #333;
          cursor: pointer; background: #f4f4f4; padding: 4px 11px; border-radius: 20px;
          border: 2px solid transparent; transition: all 0.15s; user-select: none; }
  .chip input { accent-color: #12805c; width: 13px; height: 13px; cursor: pointer; }
  .chip:has(input:checked) { border-color: #12805c; background: #e6f4ef; }
  .chip.brand-cat:has(input:checked) { border-color: #12805c; background: #e6f4ef; }
  .chip.brand-ff:has(input:checked)  { border-color: #d98324; background: #fdf1e3; }
  .chip-btns { margin-left: auto; display: flex; gap: 6px; }
  .chip-btns button { font-size: 0.72rem; padding: 4px 10px; border: 1px solid #ccc; background: #fff;
                      border-radius: 6px; cursor: pointer; color: #555; }
  .chip-btns button:hover { background: #f0f0f0; }

  /* ── Charts ── */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
  /* .big = fixed columns so charts stay large; two rows on wide screens */
  .chart-grid.big { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  @media (max-width: 1200px) { .chart-grid.big { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 760px)  { .chart-grid.big { grid-template-columns: 1fr; } }
  .chart-card { background: #fff; border-radius: 12px; padding: 18px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .chart-card h3 { font-size: 0.8rem; font-weight: 700; color: #666; text-transform: uppercase;
                   letter-spacing: 0.05em; margin-bottom: 10px; }
  .chart-div { width: 100%; height: 300px; }
  .chart-grid.big .chart-div { height: 400px; }
  .full { grid-column: 1 / -1; }

  .note { background: #fff8e6; border: 1px solid #f0d98a; color: #8a6d00; border-radius: 8px;
          padding: 10px 14px; font-size: 0.82rem; margin-bottom: 16px; }

  /* ── Table ── */
  .table-card { background: #fff; border-radius: 12px; padding: 20px;
                box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-top: 18px; overflow-x: auto; }
  .table-card h3 { font-size: 0.8rem; font-weight: 700; color: #666; text-transform: uppercase;
                   letter-spacing: 0.05em; margin-bottom: 14px; }
  table.grid { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
  table.grid th { background: #f5f5f5; padding: 8px 12px; text-align: right; font-weight: 700;
                  color: #444; border-bottom: 2px solid #e0e0e0; white-space: nowrap; }
  table.grid th:first-child { text-align: left; }
  table.grid td { padding: 6px 12px; border-bottom: 1px solid #f0f0f0; text-align: right; }
  table.grid td:first-child { text-align: left; }
  table.grid tr:hover td { background: #f6faf8; }
  table.grid .grp td { background: #e6f4ef; color: #0d6347; font-weight: 700; }
  .brand-dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; }
</style>
</head>
<body>

<div id="gate">
  <div class="gate-card">
    <h1>🐾 Chewy Sales Dashboard</h1>
    <p>Catalyst Pet &amp; Feline Fresh — enter password to view</p>
    <input type="password" id="pw" placeholder="Password" autocomplete="off"/>
    <button onclick="checkPw()">View Dashboard</button>
    <div class="error" id="pwerr"></div>
  </div>
</div>

<div id="app">
  <header>
    <h1>🐾 Catalyst Pet &amp; Feline Fresh — Chewy Sales</h1>
    <span class="meta" id="hdrmeta"></span>
  </header>
  <div class="tab-bar" id="tabbar">
    <button class="tab-btn active" data-tab="overview">Overview</button>
    <button class="tab-btn" data-tab="product">By Product</button>
    <button class="tab-btn" data-tab="brand">By Brand</button>
    <button class="tab-btn" data-tab="snapshot">Chewy Snapshot</button>
  </div>

  <div class="tab-panel active" id="tab-overview"></div>
  <div class="tab-panel" id="tab-product"></div>
  <div class="tab-panel" id="tab-brand"></div>
  <div class="tab-panel" id="tab-snapshot"></div>
</div>

<script>
const DATA = /*DATA_PLACEHOLDER*/;
const PW = "pellets123";

/* ---------- gate ---------- */
function checkPw(){
  const v = document.getElementById('pw').value;
  if (v === PW){ localStorage.setItem('chewy_auth','1'); showApp(); }
  else document.getElementById('pwerr').textContent = 'Incorrect password';
}
document.getElementById('pw').addEventListener('keydown',e=>{ if(e.key==='Enter') checkPw(); });
function showApp(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='flex';
  init();
}

/* ---------- helpers ---------- */
const CAT = '#12805c', FF = '#d98324';
const BRAND_COLOR = {'Catalyst': CAT, 'Feline Fresh': FF};
const PALETTE = ['#12805c','#0057e7','#d98324','#7b1fa2','#c2185b','#00838f',
                 '#5d4037','#455a64','#e64a19','#2e7d32','#1565c0','#ad1457',
                 '#6a1b9a','#00695c'];
const monthLabel = m => {
  const [y,mo] = m.split('-');
  return new Date(y, mo-1, 1).toLocaleDateString('en-US',{month:'short',year:'2-digit'});
};
const fmt$ = v => v==null ? '—' :
  (Math.abs(v)>=1e6 ? '$'+(v/1e6).toFixed(2)+'M' :
   Math.abs(v)>=1e3 ? '$'+(v/1e3).toFixed(1)+'K' : '$'+v.toFixed(0));
const fmt$full = v => v==null ? '—' : '$'+Math.round(v).toLocaleString();
const fmtN = v => v==null ? '—' : Math.round(v).toLocaleString();
const fmtPct = v => v==null ? '—' : v.toFixed(1)+'%';
const months = DATA.months.filter(m => m !== DATA.partial_month);
const xlabels = months.map(monthLabel);
const partialNote = DATA.partial_month
  ? monthLabel(DATA.partial_month)+' excluded (partial — report pulled mid-month)'
  : '';
// Net sales $ is only known where retail exists (snapshot months report units
// only). Net-based figures use the latest month that actually has retail data.
const retailMonths = months.filter(m =>
  Object.keys(DATA.products).some(p => m in DATA.series[p].retail));
const netLast = retailMonths.length ? retailMonths[retailMonths.length-1]
                                    : months[months.length-1];
const unitsOnlyMonths = months.filter(m => !retailMonths.includes(m));

function parts(brand){
  return Object.keys(DATA.products).filter(p => !brand || DATA.products[p].brand===brand)
    .sort((a,b)=> sumSeries(b,'retail') - sumSeries(a,'retail'));
}
function mmap(part, metric){
  if (metric==='wholesale') return DATA.wholesale[part]||{};
  if (metric==='implied')   return DATA.implied[part]||{};
  return DATA.series[part][metric]||{};
}
function sumSeries(part, metric){
  const s = mmap(part, metric);
  return months.reduce((t,m)=> t + (s[m]||0), 0);
}
function seriesArr(part, metric){
  const s = mmap(part, metric);
  return months.map(m => m in s ? s[m] : null);
}
function perUnitArr(part, metric){
  const s = mmap(part, metric), u = DATA.series[part].units;
  return months.map(m => (m in s && u[m]) ? s[m]/u[m] : null);
}
function momArr(part, metric){   // month-over-month % change
  const a = seriesArr(part, metric);
  return a.map((v,i)=> (i>0 && a[i-1]) ? (v-a[i-1])/a[i-1]*100 : null);
}
function selSumArr(sel, metric){ // sum of a metric across selected SKUs, per month
  return months.map(m=>{
    let s=0, any=false;
    sel.forEach(p=>{ const v=mmap(p,metric)[m]; if(v!=null){ s+=v; any=true; } });
    return any ? s : null;
  });
}
// Aggregate "Total" line across the selected SKUs, respecting the view mode.
function selTotalArr(sel, metric, mode){
  if (mode==='mom'){
    const b = selSumArr(sel, metric);
    return b.map((v,i)=> (i>0 && b[i-1]) ? (v-b[i-1])/b[i-1]*100 : null);
  }
  if (mode==='pu'){                       // $/unit total = sum$ / sumUnits
    const d = selSumArr(sel, metric), u = selSumArr(sel, 'units');
    return months.map((m,i)=> (d[i]!=null && u[i]) ? d[i]/u[i] : null);
  }
  if (metric==='autoship' || metric==='oos'){   // units-weighted average
    return months.map(m=>{
      let num=0, den=0;
      sel.forEach(p=>{ const v=DATA.series[p][metric][m], uu=DATA.series[p].units[m]||0;
        if(v!=null){ num+=v*uu; den+=uu; } });
      return den ? num/den : null;
    });
  }
  return selSumArr(sel, metric);          // $ or units total
}
function brandSeriesArr(brand, metric){
  const ps = parts(brand);
  return months.map(m => {
    let sum=0, any=false;
    ps.forEach(p=>{
      const s = mmap(p, metric);
      if (m in s){ sum += s[m]; any=true; }
    });
    return any ? sum : null;
  });
}
/* units-weighted average for rate metrics (autoship, oos) at brand level */
function brandWeightedArr(brand, metric){
  const ps = parts(brand);
  return months.map(m => {
    let num=0, den=0;
    ps.forEach(p=>{
      const s = DATA.series[p][metric], u = DATA.series[p].units[m]||0;
      if (m in s){ num += s[m]*u; den += u; }
    });
    return den ? num/den : null;
  });
}

/* ---------- tabs ---------- */
let built = {overview:false, product:false, brand:false, snapshot:false};
function init(){
  document.getElementById('hdrmeta').textContent =
    'Chewy sell-through · through '+monthLabel(months[months.length-1])+
    (partialNote?' · '+partialNote:'')+' · Private & Confidential';
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.onclick = ()=>{
      document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(x=>x.classList.remove('active'));
      b.classList.add('active');
      const t = b.dataset.tab;
      document.getElementById('tab-'+t).classList.add('active');
      buildTab(t);
      window.dispatchEvent(new Event('resize'));
    };
  });
  buildTab('overview');
}
function buildTab(t){
  if (built[t]) return;
  built[t] = true;
  ({overview:buildOverview, product:buildProduct, brand:buildBrand,
    snapshot:buildSnapshot})[t]();
}

const LAYOUT = extra => Object.assign({
  margin:{l:55,r:12,t:8,b:38}, font:{size:11}, showlegend:false,
  xaxis:{tickvals:xlabels.map((_,i)=>i), ticktext:xlabels, tickangle:-40, automargin:true},
  hovermode:'x unified', plot_bgcolor:'#fff', paper_bgcolor:'#fff'
}, extra||{});
const CFG = {displayModeBar:false, responsive:true};
// hovertemplate by value kind: '$' dollars, '$u' $/unit, '%' percent, 'n' count
const HT = kind => '%{fullData.name}: ' + (
  kind==='$'  ? '$%{y:,.0f}' :
  kind==='$u' ? '$%{y:,.2f}' :
  kind==='%'  ? '%{y:.1f}%'  : '%{y:,.0f}'
) + '<extra></extra>';
const htKind = (metric, mode) =>
  mode==='mom' ? '%' :
  mode==='pu' && (metric==='retail'||metric==='implied'||metric==='wholesale') ? '$u' :
  (metric==='retail'||metric==='implied'||metric==='wholesale') ? '$' :
  metric==='units' ? 'n' : '%';

/* ---------- Overview ---------- */
function buildOverview(){
  const el = document.getElementById('tab-overview');
  const last = months[months.length-1];        // units/wholesale month
  const totUnits  = parts().reduce((t,p)=> t + (DATA.series[p].units[last]||0), 0);
  const totWholesale = parts().reduce((t,p)=> t + ((DATA.wholesale[p]||{})[last]||0), 0);
  const ffWholesale = parts('Feline Fresh').some(p=>DATA.wholesale[p]);
  // Net sales $ is only known through netLast (snapshot months report units only)
  const totRetail = parts().reduce((t,p)=> t + (DATA.series[p].retail[netLast]||0), 0);
  const totImplied = parts().reduce((t,p)=> t + ((DATA.implied[p]||{})[netLast]||0), 0);
  const discPct = totImplied ? (totImplied-totRetail)/totImplied*100 : null;
  // FY YTD from Chewy Summary (authoritative)
  let fy26=0, fy25=0;
  Object.values(DATA.fy_summary).forEach(f=>{ fy26+=f.fy26_ytd||0; fy25+=f.fy25_ytd||0; });
  const fyChg = fy25 ? (fy26-fy25)/fy25*100 : null;
  const catRetail = brandSeriesArr('Catalyst','retail').reduce((t,v)=>t+(v||0),0);
  const ffRetail  = brandSeriesArr('Feline Fresh','retail').reduce((t,v)=>t+(v||0),0);
  const autoArr = brandWeightedArr('Catalyst','autoship');
  let ai = months.length-1; while(ai>=0 && autoArr[ai]==null) ai--;
  const avgAuto = ai>=0 ? autoArr[ai] : null;
  const autoMonth = ai>=0 ? monthLabel(months[ai]) : '';

  el.innerHTML = `
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Net Sales $ — ${monthLabel(netLast)}</div>
        <div class="kpi-value">${fmt$(totRetail)}</div><div class="kpi-sub">actual (latest reported)</div></div>
      <div class="kpi-card" style="border-left-color:#888"><div class="kpi-label">Implied Retail $ — ${monthLabel(netLast)}</div>
        <div class="kpi-value">${fmt$(totImplied)}</div><div class="kpi-sub">at list · ${discPct==null?'':discPct.toFixed(0)+'% below list'}</div></div>
      <div class="kpi-card"><div class="kpi-label">Units — ${monthLabel(last)}</div>
        <div class="kpi-value">${fmtN(totUnits)}</div><div class="kpi-sub">latest snapshot, both brands</div></div>
      <div class="kpi-card"><div class="kpi-label">FY26 YTD Retail $</div>
        <div class="kpi-value">${fmt$(fy26)}<span class="kpi-chg ${fyChg>=0?'up':'down'}">${fyChg==null?'':(fyChg>=0?'▲':'▼')+Math.abs(fyChg).toFixed(0)+'%'}</span></div>
        <div class="kpi-sub">vs ${fmt$(fy25)} FY25 YTD</div></div>
      <div class="kpi-card"><div class="kpi-label">Retail $ (${months.length} mo)</div>
        <div class="kpi-value">${fmt$(catRetail+ffRetail)}</div>
        <div class="kpi-sub"><span class="brand-dot" style="background:${CAT}"></span>Catalyst ${fmt$(catRetail)} · <span class="brand-dot" style="background:${FF}"></span>FF ${fmt$(ffRetail)}</div></div>
      <div class="kpi-card"><div class="kpi-label">Autoship % (Catalyst)</div>
        <div class="kpi-value">${fmtPct(avgAuto)}</div><div class="kpi-sub">subscription share · ${autoMonth}</div></div>
      <div class="kpi-card"><div class="kpi-label">Wholesale $ — ${monthLabel(last)}</div>
        <div class="kpi-value">${DATA.have_wholesale?fmt$(totWholesale):'—'}</div>
        <div class="kpi-sub">${DATA.have_wholesale?(ffWholesale?'price × units, latest mo':'Catalyst only · FF pending'):'pending unit prices'}</div></div>
    </div>
    ${DATA.have_wholesale?'':'<div class="note">💡 <b>Wholesale $</b> charts activate once per-SKU wholesale prices are supplied (<code>WHOLESALE_PRICES</code> in <code>chewy_extract.py</code>). Wholesale $ = price × units, so it will break out by product and brand.</div>'}
    ${unitsOnlyMonths.length?`<div class="note">📄 <b>${unitsOnlyMonths.map(monthLabel).join(' & ')}</b> come from the Brand Snapshot PDFs, which report <b>units only</b>. Units &amp; wholesale $ (units × cost) are shown for these months; <b>net sales $, margin, autoship % and PDP OOS % are left blank</b> until Chewy's L52W report lands (latest net sales: <b>${monthLabel(netLast)}</b>).</div>`:''}
    <div class="note">🏷️ <b>Net Sales $</b> = what Chewy actually rang up (reconciles to Chewy's Summary). <b>Implied Retail $</b> = units × your list price. The gap is the promo/autoship discount.</div>
    <div class="chart-grid">
      <div class="chart-card"><h3>Net Sales $ by Brand</h3><div class="chart-div" id="ov-retail"></div></div>
      <div class="chart-card"><h3>Units by Brand</h3><div class="chart-div" id="ov-units"></div></div>
      <div class="chart-card full"><h3>Total Net Sales $ (bars) vs Implied Retail at List (line)</h3><div class="chart-div" id="ov-total"></div></div>
    </div>`;

  const brands = ['Catalyst','Feline Fresh'];
  Plotly.newPlot('ov-retail', brands.map(b=>({
    x:xlabels, y:brandSeriesArr(b,'retail'), name:b, type:'scatter', mode:'lines+markers',
    line:{color:BRAND_COLOR[b],width:2.5}, marker:{size:5}, hovertemplate:HT('$')
  })), LAYOUT({showlegend:true, legend:{orientation:'h',y:1.12}, yaxis:{tickprefix:'$',tickformat:'.2s'}}), CFG);

  Plotly.newPlot('ov-units', brands.map(b=>({
    x:xlabels, y:brandSeriesArr(b,'units'), name:b, type:'scatter', mode:'lines+markers',
    line:{color:BRAND_COLOR[b],width:2.5}, marker:{size:5}, hovertemplate:HT('n')
  })), LAYOUT({showlegend:true, legend:{orientation:'h',y:1.12}, yaxis:{tickformat:',d'}}), CFG);

  const impliedTot = months.map((m,i)=> (brandSeriesArr('Catalyst','implied')[i]||0)+(brandSeriesArr('Feline Fresh','implied')[i]||0));
  Plotly.newPlot('ov-total', [
    {x:xlabels, y:brandSeriesArr('Catalyst','retail'), name:'Catalyst (net)', type:'bar', marker:{color:CAT}, hovertemplate:HT('$')},
    {x:xlabels, y:brandSeriesArr('Feline Fresh','retail'), name:'Feline Fresh (net)', type:'bar', marker:{color:FF}, hovertemplate:HT('$')},
    {x:xlabels, y:impliedTot, name:'Implied at list', type:'scatter', mode:'lines+markers',
     line:{color:'#555',dash:'dot',width:2}, marker:{size:4}, hovertemplate:HT('$')}
  ], LAYOUT({barmode:'stack', showlegend:true, legend:{orientation:'h',y:1.1}, yaxis:{tickprefix:'$',tickformat:'.2s'}}), CFG);
}

/* ---------- By Product ---------- */
let prodState = {brand:'Catalyst', selected:new Set(), view:'tot'};
function buildProduct(){
  const el = document.getElementById('tab-product');
  el.innerHTML = `
    <div class="filter-bar" id="prod-brandbar">
      <span class="lbl">Brand:</span>
      <label class="chip"><input type="radio" name="pbrand" value="Catalyst" checked> Catalyst Pet</label>
      <label class="chip"><input type="radio" name="pbrand" value="Feline Fresh"> Feline Fresh</label>
      <span class="lbl" style="margin-left:auto">View:</span>
      <label class="chip"><input type="radio" name="pview" value="tot" checked> Totals</label>
      <label class="chip"><input type="radio" name="pview" value="pu"> Per unit ($/bag)</label>
      <label class="chip"><input type="radio" name="pview" value="mom"> MoM % growth</label>
    </div>
    <div class="filter-bar" id="prod-chips"></div>
    <div class="kpi-row" id="prod-totals" style="margin-bottom:16px"></div>
    <div class="chart-grid big" id="prod-charts"></div>
    <div class="table-card"><h3>Monthly detail — <span id="prod-tbl-title"></span></h3>
      <div style="overflow-x:auto"><table class="grid" id="prod-table"></table></div></div>`;
  el.querySelectorAll('input[name=pbrand]').forEach(r=>{
    r.onchange = ()=>{ prodState.brand=r.value; prodState.selected.clear(); renderProdChips(); renderProd(); };
  });
  el.querySelectorAll('input[name=pview]').forEach(r=>{
    r.onchange = ()=>{ prodState.view = r.value; renderProd(); };
  });
  renderProdChips();
  renderProd();
}
function renderProdChips(){
  const ps = parts(prodState.brand);
  if (prodState.selected.size===0) ps.slice(0,8).forEach(p=>prodState.selected.add(p));
  const bar = document.getElementById('prod-chips');
  bar.innerHTML = `<span class="lbl">SKUs:</span>` + ps.map(p=>{
    const pr = DATA.products[p];
    return `<label class="chip"><input type="checkbox" value="${p}" ${prodState.selected.has(p)?'checked':''}> ${pr.short}</label>`;
  }).join('') + `<span class="chip-btns"><button data-a="all">All</button><button data-a="none">None</button></span>`;
  bar.querySelectorAll('input').forEach(c=>c.onchange=()=>{
    c.checked?prodState.selected.add(c.value):prodState.selected.delete(c.value); renderProd();
  });
  bar.querySelectorAll('.chip-btns button').forEach(b=>b.onclick=()=>{
    prodState.selected.clear();
    if (b.dataset.a==='all') ps.forEach(p=>prodState.selected.add(p));
    renderProdChips(); renderProd();
  });
}
function renderProd(){
  const sel = [...prodState.selected];
  const view = prodState.view, pu = view==='pu', mom = view==='mom';
  renderProdTotals(sel);
  document.getElementById('prod-tbl-title').textContent =
    prodState.brand + (pu ? ' · per unit ($/bag)' : mom ? ' · MoM % growth' : '');
  const dollar = new Set(['retail','implied','wholesale']);
  const numeric = new Set(['retail','implied','units','wholesale']);
  const puLabel = {retail:'Net Sales $/unit (realized)', implied:'List $/unit', wholesale:'Cost $/unit'};
  const momLabel = {retail:'Net Sales MoM %', implied:'Implied Retail MoM %', units:'Units MoM %', wholesale:'Wholesale MoM %'};
  const defs = [
    ['retail','Net Sales $ (actual)', v=>({tickprefix:'$',tickformat:'.2s'})],
    ['implied','Implied Retail $ (list)', v=>({tickprefix:'$',tickformat:'.2s'})],
    ['units','Units', v=>({tickformat:',d'})],
    ['wholesale','Wholesale $', v=>({tickprefix:'$',tickformat:'.2s'})],
    ['autoship','Autoship %', v=>({ticksuffix:'%',range:[0,100]})],
    ['oos','PDP OOS %', v=>({ticksuffix:'%'})],
  ];
  const title = d => (pu && dollar.has(d[0])) ? puLabel[d[0]] : (mom && numeric.has(d[0])) ? momLabel[d[0]] : d[1];
  const grid = document.getElementById('prod-charts');
  grid.innerHTML = defs.map(d=>`<div class="chart-card"><h3>${title(d)}</h3><div class="chart-div" id="pc-${d[0]}"></div></div>`).join('');
  defs.forEach(d=>{
    const metric=d[0];
    if (metric==='wholesale' && !DATA.have_wholesale){
      document.getElementById('pc-'+metric).innerHTML =
        '<div style="display:flex;height:100%;align-items:center;justify-content:center;color:#aaa;font-size:.85rem;text-align:center;padding:0 20px">Pending per-SKU wholesale prices</div>';
      return;
    }
    const asPU = pu && dollar.has(metric), asMoM = mom && numeric.has(metric);
    const kind = htKind(metric, asMoM?'mom':asPU?'pu':'tot');
    const mode = asMoM?'mom':asPU?'pu':'tot';
    const traces = sel.map((p,i)=>({
      x:xlabels, y: asPU ? perUnitArr(p,metric) : asMoM ? momArr(p,metric) : seriesArr(p,metric),
      name:DATA.products[p].short, hovertemplate:HT(kind), showlegend:false,
      type:'scatter', mode:'lines+markers', line:{width:2,color:PALETTE[parts(prodState.brand).indexOf(p)%PALETTE.length]}, marker:{size:4}
    }));
    let showLegend = false;
    if (sel.length>1){
      const tname = (asPU||metric==='autoship'||metric==='oos') ? 'Total (wtd avg)' : 'Total (selected)';
      traces.push({
        x:xlabels, y:selTotalArr(sel,metric,mode), name:tname, hovertemplate:HT(kind), showlegend:true,
        type:'scatter', mode:'lines', line:{width:3.5,color:'#111',dash:'dash'}, marker:{size:0}
      });
      showLegend = true;
    }
    const yax = asPU ? {tickprefix:'$'} : asMoM ? {ticksuffix:'%',zeroline:true} : d[2]();
    Plotly.newPlot('pc-'+metric, traces, LAYOUT({yaxis:yax, showlegend:showLegend, legend:{orientation:'h',y:1.12,font:{size:10}}}), CFG);
  });
  renderProdTable(sel);
}
function renderProdTotals(sel){
  const sumM = (metric,mlist) => sel.reduce((t,p)=> t + mlist.reduce((x,m)=>x+(mmap(p,metric)[m]||0),0), 0);
  const net = sumM('retail',months), imp = sumM('implied',months), u = sumM('units',months), w = sumM('wholesale',months);
  // margin / discount / avg computed only over months where net sales is known
  const netR = sumM('retail',retailMonths), wR = sumM('wholesale',retailMonths),
        uR = sumM('units',retailMonths), impR = sumM('implied',retailMonths);
  const disc = impR ? (impR-netR)/impR*100 : null;
  const gm = netR ? (netR-wR)/netR*100 : null;
  const card = (lbl,val,sub,accent)=>`<div class="kpi-card"${accent?` style="border-left-color:${accent}"`:''}>
    <div class="kpi-label">${lbl}</div><div class="kpi-value">${val}</div><div class="kpi-sub">${sub||''}</div></div>`;
  document.getElementById('prod-totals').innerHTML =
    card('Net Sales $', fmt$(net), `${sel.length} SKU${sel.length!==1?'s':''} · thru ${monthLabel(netLast)}`) +
    card('Implied Retail $ (list)', fmt$(imp), disc==null?'':`${disc.toFixed(0)}% below list`, '#888') +
    card('Units', fmtN(u), 'total sell-through') +
    card('Wholesale $', fmt$(w), 'units × cost') +
    card('Avg Net $/Unit', uR?'$'+(netR/uR).toFixed(2):'—', 'realized') +
    card('Chewy Margin %', gm==null?'—':gm.toFixed(0)+'%', 'net vs cost');
}
function renderProdTable(sel){
  const view = prodState.view, pu = view==='pu', mom = view==='mom';
  const t = document.getElementById('prod-table');
  const head = `<tr><th>SKU</th><th>CT</th>`+xlabels.map(l=>`<th>${l}</th>`).join('')+`<th>${pu?'Avg':'Total'}</th></tr>`;
  let grp, rows;
  if (mom){
    grp = 'Units by month, with MoM % growth';
    rows = sel.map(p=>{
      const pr = DATA.products[p], u = seriesArr(p,'units'), g = momArr(p,'units');
      const tot = u.reduce((t,v)=>t+(v||0),0);
      const cells = u.map((v,i)=>{
        if (v==null) return '<td>—</td>';
        const mm = g[i];
        const badge = mm==null ? '' :
          `<br><span style="font-size:.7rem;color:${mm>=0?'#12805c':'#d32f2f'}">${mm>=0?'▲':'▼'}${Math.abs(mm).toFixed(0)}%</span>`;
        return `<td>${fmtN(v)}${badge}</td>`;
      }).join('');
      return `<tr><td><span class="brand-dot" style="background:${BRAND_COLOR[pr.brand]}"></span>${pr.short}</td><td>${pr.ct||''}</td>${cells}<td><b>${fmtN(tot)}</b></td></tr>`;
    }).join('');
  } else {
    const money = pu ? (v=>'$'+v.toFixed(2)) : fmt$;
    rows = sel.map(p=>{
      const pr = DATA.products[p];
      const arr = pu ? perUnitArr(p,'retail') : seriesArr(p,'retail');
      let last;
      if (pu){
        const u = seriesArr(p,'units').reduce((t,v)=>t+(v||0),0);
        const n = seriesArr(p,'retail').reduce((t,v)=>t+(v||0),0);
        last = u ? n/u : null;
      } else last = arr.reduce((t,v)=>t+(v||0),0);
      return `<tr><td><span class="brand-dot" style="background:${BRAND_COLOR[pr.brand]}"></span>${pr.short}</td><td>${pr.ct||''}</td>`+
        arr.map(v=>`<td>${v==null?'—':money(v)}</td>`).join('')+`<td><b>${last==null?'—':money(last)}</b></td></tr>`;
    }).join('');
    grp = pu ? 'Net Sales $/unit by month (realized)' : 'Net Sales $ by month (actual)';
  }
  t.innerHTML = `<thead>${head}</thead><tbody><tr class="grp"><td colspan="${xlabels.length+3}">${grp}</td></tr>${rows}</tbody>`;
}

/* ---------- By Brand ---------- */
function buildBrand(){
  const el = document.getElementById('tab-brand');
  const brands=['Catalyst','Feline Fresh'];
  const bt = b => {
    const bsum=(metric,ml)=>{ const arr=brandSeriesArr(b,metric); return ml.reduce((t,m)=>t+(arr[months.indexOf(m)]||0),0); };
    // units/wholesale over all months; net-based over retail-known months only
    return {u:bsum('units',months), w:bsum('wholesale',months),
            netR:bsum('retail',retailMonths), impR:bsum('implied',retailMonths),
            uR:bsum('units',retailMonths), wR:bsum('wholesale',retailMonths)};
  };
  const tC=bt('Catalyst'), tF=bt('Feline Fresh');
  const tT={u:tC.u+tF.u, w:tC.w+tF.w, netR:tC.netR+tF.netR, impR:tC.impR+tF.impR, uR:tC.uR+tF.uR, wR:tC.wR+tF.wR};
  const trow=(lbl,t,color)=>`<tr><td><span class="brand-dot" style="background:${color}"></span>${lbl}</td>`+
    `<td>${fmt$(t.netR)}</td><td>${fmt$(t.impR)}</td><td>${t.impR?((t.impR-t.netR)/t.impR*100).toFixed(0)+'%':'—'}</td>`+
    `<td>${fmtN(t.u)}</td><td>${fmt$(t.w)}</td><td>${t.uR?'$'+(t.netR/t.uR).toFixed(2):'—'}</td>`+
    `<td>${t.netR?((t.netR-t.wR)/t.netR*100).toFixed(0)+'%':'—'}</td></tr>`;
  el.innerHTML = `
    <div class="table-card" style="margin-top:0">
      <h3>Totals — units &amp; wholesale thru ${monthLabel(months[months.length-1])} · net sales thru ${monthLabel(netLast)}</h3>
      <table class="grid">
        <thead><tr><th>Brand</th><th>Net Sales $</th><th>Implied (list) $</th><th>Disc vs list</th><th>Units</th><th>Wholesale $</th><th>Avg net $/unit</th><th>Chewy margin</th></tr></thead>
        <tbody>${trow('Catalyst',tC,CAT)}${trow('Feline Fresh',tF,FF)}<tr class="grp">${trow('Total (US)',tT,'#333').replace('<tr>','').replace('</tr>','')}</tr></tbody>
      </table>
    </div>
    <div class="chart-grid big" style="margin-top:18px">
      <div class="chart-card"><h3>Net Sales $ (actual)</h3><div class="chart-div" id="br-retail"></div></div>
      <div class="chart-card"><h3>Implied Retail $ (list)</h3><div class="chart-div" id="br-implied"></div></div>
      <div class="chart-card"><h3>Units</h3><div class="chart-div" id="br-units"></div></div>
      <div class="chart-card"><h3>Wholesale $</h3><div class="chart-div" id="br-wholesale"></div></div>
      <div class="chart-card"><h3>Autoship % (units-weighted)</h3><div class="chart-div" id="br-autoship"></div></div>
      <div class="chart-card"><h3>PDP OOS % (units-weighted)</h3><div class="chart-div" id="br-oos"></div></div>
      <div class="chart-card"><h3>Avg Net Sales $ / Unit</h3><div class="chart-div" id="br-aov"></div></div>
      <div class="chart-card"><h3>Discount vs List % (units-weighted)</h3><div class="chart-div" id="br-disc"></div></div>
    </div>
    ${DATA.canada&&DATA.canada.months.length?`<div class="chart-card full" style="margin-top:18px">
      <h3>🇨🇦 Feline Fresh — Chewy Canada (units)</h3>
      <div class="note" style="margin-bottom:10px">Chewy CA kg SKUs, from the Brand Snapshot PDFs. Reported Aug '25 – Mar '26 only (dropped afterward) and <b>not included in the US totals above</b>. Wholesale $ shown; retail $ n/a (CAD pricing not provided).</div>
      <div class="chart-div" id="ca-chart" style="height:300px"></div></div>`:''}`;
  const mk = (id,fn,yax,kind)=>Plotly.newPlot(id, brands.map(b=>({
      x:xlabels, y:fn(b), name:b, type:'scatter', mode:'lines+markers',
      line:{color:BRAND_COLOR[b],width:2.5}, marker:{size:5}, hovertemplate:HT(kind)
    })), LAYOUT({showlegend:true, legend:{orientation:'h',y:1.12}, yaxis:yax}), CFG);
  mk('br-retail', b=>brandSeriesArr(b,'retail'), {tickprefix:'$',tickformat:'.2s'}, '$');
  mk('br-implied', b=>brandSeriesArr(b,'implied'), {tickprefix:'$',tickformat:'.2s'}, '$');
  mk('br-units', b=>brandSeriesArr(b,'units'), {tickformat:',d'}, 'n');
  mk('br-autoship', b=>brandWeightedArr(b,'autoship'), {ticksuffix:'%',range:[0,100]}, '%');
  mk('br-oos', b=>brandWeightedArr(b,'oos'), {ticksuffix:'%'}, '%');
  mk('br-aov', b=>months.map((m,i)=>{
      const r=brandSeriesArr(b,'retail')[i], u=brandSeriesArr(b,'units')[i];
      return (r&&u)? r/u : null;
    }), {tickprefix:'$'}, '$u');
  mk('br-disc', b=>months.map((m,i)=>{
      const net=brandSeriesArr(b,'retail')[i], imp=brandSeriesArr(b,'implied')[i];
      return (net!=null&&imp) ? (imp-net)/imp*100 : null;
    }), {ticksuffix:'%'}, '%');
  mk('br-wholesale', b=>brandSeriesArr(b,'wholesale'), {tickprefix:'$',tickformat:'.2s'}, '$');
  if (DATA.canada&&DATA.canada.months.length){
    const cm=DATA.canada.months, skus=Object.keys(DATA.canada.units);
    const cl=cm.map(monthLabel);
    Plotly.newPlot('ca-chart', skus.map((s,i)=>({
      x:cl, y:cm.map(m=>DATA.canada.units[s][m]??null), name:s, type:'bar', marker:{color:i?FF:'#b5651d'}, hovertemplate:HT('n')
    })), LAYOUT({barmode:'stack', showlegend:true, legend:{orientation:'h',y:1.15},
      xaxis:{}, yaxis:{tickformat:',d'}}), CFG);
  }
}

/* ---------- Chewy Snapshot ---------- */
function buildSnapshot(){
  const el = document.getElementById('tab-snapshot');
  const snap = DATA.snapshot;
  el.innerHTML = `
    <div class="note">📄 Sourced from the latest Chewy Brand Snapshot PDFs (${snap.Catalyst.month}). Current-month view, not a time series.</div>
    <div class="kpi-row">
      <div class="kpi-card"><div class="kpi-label">Catalyst — Avg Rating</div><div class="kpi-value">★ ${snap.Catalyst.rating.toFixed(2)}</div></div>
      <div class="kpi-card" style="border-left-color:${FF}"><div class="kpi-label">Feline Fresh — Avg Rating</div><div class="kpi-value">★ ${snap['Feline Fresh'].rating.toFixed(2)}</div></div>
    </div>
    <div class="chart-grid">
      <div class="chart-card"><h3>Catalyst — Top 10 States (units)</h3><div class="chart-div" id="sn-cat"></div></div>
      <div class="chart-card"><h3>Feline Fresh — Top 10 States (units)</h3><div class="chart-div" id="sn-ff"></div></div>
    </div>`;
  const bar = (id,rows,color)=>{
    const r = rows.slice().reverse();
    Plotly.newPlot(id, [{x:r.map(s=>s[1]), y:r.map(s=>s[0]), type:'bar', orientation:'h',
      marker:{color}, text:r.map(s=>fmtN(s[1])), textposition:'auto', hovertemplate:'%{y}: %{x:,.0f} units<extra></extra>'}],
      LAYOUT({margin:{l:40,r:12,t:8,b:30}, xaxis:{tickformat:',d'}, yaxis:{automargin:true}, hovermode:'closest'}), CFG);
  };
  bar('sn-cat', snap.Catalyst.top_states, CAT);
  bar('sn-ff', snap['Feline Fresh'].top_states, FF);
}

/* auto-enter if already authed (runs after all decls are initialized) */
if (localStorage.getItem('chewy_auth')==='1') showApp();
