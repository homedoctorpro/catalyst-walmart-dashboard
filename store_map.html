let storeMapLeaflet = null;
let storeMapActiveCombo = null;

function initStoreMap() {
  if (MAP_DATA.as_of) document.getElementById("header-sub").textContent = `As of ${MAP_DATA.as_of}`;

  // Build per-combo cluster groups
  const comboGroups = {}; // combo key -> { clusterGroup, stores[], color, label }
  Object.entries(MAP_DATA.stores).forEach(([sn, info]) => {
    if (!info.lat || !info.lon) return;
    const skuArr = (info.skus || []).slice().sort();
    if (!skuArr.length) return;
    const combo = skuArr.join(",");
    const color = SKU_COMBO_COLORS[combo] || "#999999";

    if (!comboGroups[combo]) {
      comboGroups[combo] = {
        clusterGroup: L.markerClusterGroup({
          maxClusterRadius: 50, disableClusteringAtZoom: 10,
          showCoverageOnHover: false, spiderfyOnMaxZoom: true,
        }),
        stores: [], color,
        label: skuArr.map(s => SKU_SHORT[s] || s).join(" / "),
      };
    }
    const popup = `<strong>Store #${sn}</strong><br>${info.city || ""}, ${info.state || ""}<br>${info.street || ""}<br><br><strong>SKUs (${skuArr.length}):</strong><br>${skuArr.map(s => `&bull; ${SKU_SHORT[s]||s}`).join("<br>")}`;
    L.circleMarker([info.lat, info.lon], {
      radius: 6, fillColor: color, color: "#000", weight: 1, opacity: 1, fillOpacity: 0.8,
    }).bindPopup(popup).addTo(comboGroups[combo].clusterGroup);
    comboGroups[combo].stores.push(sn);
  });

  const map = L.map("store-map-leaflet", { center: [39.8283, -98.5795], zoom: 5 });
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  Object.values(comboGroups).forEach(g => map.addLayer(g.clusterGroup));

  // Info box (top-right)
  const totalStores = Object.values(comboGroups).reduce((s, g) => s + g.stores.length, 0);
  const infoCtrl = L.control({ position: "topright" });
  infoCtrl.onAdd = () => {
    const d = L.DomUtil.create("div", "store-map-info");
    d.innerHTML = `<strong>${totalStores.toLocaleString()} stores</strong><br><span style="font-size:0.75rem;color:#666">${Object.keys(comboGroups).length} SKU combinations</span>`;
    return d;
  };
  infoCtrl.addTo(map);

  // Legend (bottom-left)
  const legendCtrl = L.control({ position: "bottomleft" });
  legendCtrl.onAdd = () => {
    const d = L.DomUtil.create("div", "store-map-legend");
    L.DomEvent.disableClickPropagation(d);
    const sorted = Object.entries(comboGroups).sort((a, b) => b[1].stores.length - a[1].stores.length);
    d.innerHTML = `<h4>SKU Combinations <span style="font-weight:400;font-size:0.75rem">(click to filter)</span></h4>` +
      sorted.map(([combo, g]) =>
        `<div class="legend-item" data-combo="${combo}">
          <span class="legend-dot" style="background:${g.color}"></span>
          <span><strong>${g.stores.length}</strong> &nbsp;${g.label}</span>
        </div>`
      ).join("");
    d.querySelectorAll(".legend-item").forEach(el => {
      el.addEventListener("click", () => toggleStoreMapCombo(el, el.dataset.combo));
    });
    return d;
  };
  legendCtrl.addTo(map);

  storeMapLeaflet = { map, comboGroups };
}

function toggleStoreMapCombo(el, combo) {
  const { map, comboGroups } = storeMapLeaflet;
  if (storeMapActiveCombo === combo) {
    Object.values(comboGroups).forEach(g => { if (!map.hasLayer(g.clusterGroup)) map.addLayer(g.clusterGroup); });
    document.querySelectorAll(".store-map-legend .legend-item").forEach(i => i.classList.remove("active"));
    storeMapActiveCombo = null;
  } else {
    Object.entries(comboGroups).forEach(([c, g]) => {
      if (c === combo) { if (!map.hasLayer(g.clusterGroup)) map.addLayer(g.clusterGroup); }
      else             { if ( map.hasLayer(g.clusterGroup)) map.removeLayer(g.clusterGroup); }
    });
    document.querySelectorAll(".store-map-legend .legend-item").forEach(i => i.classList.remove("active"));
    el.classList.add("active");
    storeMapActiveCombo = combo;
  }
}

initStoreMap();
</script>
</body>
</html>
